<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Crawler</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #1a1a2e;
        color: #fff;
        font-family: 'Courier New', Courier, monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      
      #game-container {
        position: relative;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), 0 0 0 4px #555;
        border-radius: 4px;
        background-color: #000;
        /* Canvas width and height will determine size */
      }

      canvas {
        display: block;
        /* Flash/shake animations can be applied here later */
      }

      .instructions {
        margin-top: 20px;
        text-align: center;
        color: #aaa;
        font-size: 14px;
      }

      @keyframes shake {
        0% { transform: translate(1px, 1px) rotate(0deg); }
        10% { transform: translate(-1px, -2px) rotate(-1deg); }
        20% { transform: translate(-3px, 0px) rotate(1deg); }
        30% { transform: translate(3px, 2px) rotate(0deg); }
        40% { transform: translate(1px, -1px) rotate(1deg); }
        50% { transform: translate(-1px, 2px) rotate(-1deg); }
        60% { transform: translate(-3px, 1px) rotate(0deg); }
        70% { transform: translate(3px, 1px) rotate(-1deg); }
        80% { transform: translate(-1px, -1px) rotate(1deg); }
        90% { transform: translate(1px, 2px) rotate(0deg); }
        100% { transform: translate(1px, -2px) rotate(-1deg); }
      }

      @keyframes flash-red {
        0% { filter: hue-rotate(0deg) saturate(2) brightness(1.5); box-shadow: 0 0 40px red inset; }
        100% { filter: none; box-shadow: none; }
      }

      .shake {
        animation: shake 0.4s;
      }

      .flash-red {
        animation: flash-red 0.3s;
      }
    </style>
  </head>
  <body>
    <div id="game-container">
      <canvas id="gameCanvas"></canvas>
    </div>
    <div class="instructions">
      <p>Arrow Keys / WASD to move. Space to Attack. R to Restart.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
